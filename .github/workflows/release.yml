name: Release on version bump

# The plugin self-updates via a GitHub Release (see plugin-update-checker in
# karuna-booking-search.php). Pushing a bumped "Version:" header to main is
# not enough on its own — WordPress won't see an update until a matching
# Release + zip exists. This workflow creates that Release automatically.

on:
  push:
    branches: [main]
    paths:
      - karuna-booking-search.php
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 '^ \* Version:' karuna-booking-search.php | sed -E 's/.*Version:[[:space:]]*//')
          if [ -z "$VERSION" ]; then
            echo "Could not read Version header" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/build/karuna-booking-search
          git archive HEAD | tar -x -C /tmp/build/karuna-booking-search
          (cd /tmp/build && zip -rq "$GITHUB_WORKSPACE/karuna-booking-search.zip" karuna-booking-search)

      - name: Publish GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            karuna-booking-search.zip \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
